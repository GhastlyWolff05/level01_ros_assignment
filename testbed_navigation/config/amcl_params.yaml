amcl:
  ros__parameters:
    use_sim_time: true

    # Frames. base_footprint is the frame the diff-drive plugin publishes odom against,
    # so AMCL must localize that same frame.
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"

    # Differential robot, so we use the diff motion model.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter size. 2000 is plenty for this small room and stays light on CPU.
    min_particles: 500
    max_particles: 2000

    # Laser model. The testbed lidar is short-range, so keep laser_max_range in step
    # with whatever max range the sensor actually reports.
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: 12.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2

    # Motion noise for a diff drive.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Update often enough that localization keeps up while driving.
    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    pf_err: 0.05
    pf_z: 0.99
    save_pose_rate: 0.5
    tf_broadcast: true
    first_map_only: false
    always_reset_initial_pose: false

    # The robot spawns at (0, 5) in Gazebo, so seed AMCL there. This saves us from
    # having to click a "2D Pose Estimate" in RViz every single run.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0